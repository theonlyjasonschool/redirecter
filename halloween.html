<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050308">
  <title>Halloween event</title>
  <style>
    :root {
      --bg: #0a0612;
      --orange: #ff7a18;
      --cream: #f5e6c8;
      --wood: #3d2914;
      --lamp: #c9a227;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { font-family: "Segoe UI", system-ui, sans-serif; }

    .video-background {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      animation: video-in 1.2s ease-out 11.6s forwards;
    }

    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 30%, #1a0f2e 0%, var(--bg) 70%);
      animation: scene-out 1s ease-in 11.6s forwards;
    }

    .wall {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.35)), repeating-linear-gradient(90deg, #160b28 0 48px, #1c1032 48px 50px);
    }

    .window {
      position: absolute;
      top: 8%;
      right: 12%;
      width: 18%;
      height: 42%;
      border: 4px solid #2a1a40;
      background: linear-gradient(#1a2840, #0d1520);
      box-shadow: inset 0 0 40px rgba(100, 140, 200, .15);
    }

    .window::before, .window::after { position: absolute; content: ""; background: #2a1a40; }
    .window::before { top: 0; bottom: 0; left: 50%; width: 3px; transform: translateX(-50%); }
    .window::after { top: 50%; right: 0; left: 0; height: 3px; transform: translateY(-50%); }

    .moon {
      position: absolute;
      top: 12%;
      left: 18%;
      width: 28%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f0f4ff, #a8b8d0 70%);
      opacity: .55;
      filter: blur(1px);
    }

    .floor {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 28%;
      border-top: 3px solid #1a1008;
      background: linear-gradient(#2a1810, #1a0e08);
    }

    .floor::before {
      position: absolute;
      inset: 0;
      content: "";
      background: repeating-linear-gradient(90deg, transparent 0 40px, rgba(0,0,0,.25) 40px 42px);
    }

    .table {
      position: absolute;
      bottom: 22%;
      left: 50%;
      width: 22%;
      height: 6%;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(#5a3a1e, var(--wood));
      transform: translateX(-50%);
    }

    .table::before, .table::after {
      position: absolute;
      bottom: -120%;
      width: 8%;
      height: 120%;
      content: "";
      background: var(--wood);
    }
    .table::before { left: 12%; }
    .table::after { right: 12%; }

    .lamp {
      position: absolute;
      bottom: 28%;
      left: 50%;
      width: 10%;
      height: 32%;
      transform: translateX(-50%);
      transform-origin: 50% 100%;
      animation: lamp-fall 3s ease-in forwards;
    }

    .lamp-shade {
      position: absolute;
      top: 0;
      left: 50%;
      width: 90%;
      height: 28%;
      background: linear-gradient(#e8c878, var(--lamp));
      clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
      transform: translateX(-50%);
    }

    .lamp-glow {
      position: absolute;
      top: 20%;
      left: 50%;
      width: 160%;
      height: 80%;
      background: radial-gradient(ellipse, rgba(255, 200, 80, .35), transparent 70%);
      transform: translateX(-50%);
      animation: glow-out 3s ease-in forwards;
    }

    .lamp-stem {
      position: absolute;
      top: 26%;
      left: 50%;
      width: 12%;
      height: 48%;
      border-radius: 2px;
      background: linear-gradient(90deg, #8a7020, #e0c050, #8a7020);
      transform: translateX(-50%);
    }

    .lamp-base {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 70%;
      height: 18%;
      border-radius: 40% 40% 20% 20%;
      background: linear-gradient(#d4b040, #6a5010);
      transform: translateX(-50%);
    }

    .shards {
      position: absolute;
      bottom: 24%;
      left: 58%;
      width: 20%;
      height: 20%;
      pointer-events: none;
    }

    .shard {
      position: absolute;
      top: 45%;
      left: 45%;
      width: 10px;
      height: 14px;
      background: linear-gradient(135deg, rgba(255,255,255,.85), rgba(180,220,255,.4));
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      opacity: 0;
      animation: shard-fly .9s ease-out 2.7s forwards;
    }
    .shard:nth-child(1) { --dx: -40px; --dy: -50px; --rot: -40deg; }
    .shard:nth-child(2) { --dx: 10px; --dy: -70px; --rot: 20deg; animation-delay: 2.7s; }
    .shard:nth-child(3) { --dx: 50px; --dy: -40px; --rot: 55deg; animation-delay: 2.75s; }
    .shard:nth-child(4) { --dx: -30px; --dy: 20px; --rot: -80deg; animation-delay: 2.72s; }
    .shard:nth-child(5) { --dx: 60px; --dy: 10px; --rot: 90deg; animation-delay: 2.78s; }
    .shard:nth-child(6) { --dx: 5px; --dy: 40px; --rot: 10deg; animation-delay: 2.8s; }

    .broken-base {
      position: absolute;
      bottom: 24%;
      left: 52%;
      width: 8%;
      height: 5%;
      border-radius: 20%;
      background: linear-gradient(#8a7020, #3a2808);
      opacity: 0;
      transform: translateX(-50%) rotate(12deg);
      animation: show-base .2s ease-out 2.85s forwards;
    }

    .ghosts { position: absolute; inset: 0; pointer-events: none; }
    .ghost {
      position: absolute;
      bottom: 26%;
      left: 50%;
      width: 70px;
      height: 90px;
      opacity: 0;
      filter: drop-shadow(0 0 12px rgba(200, 230, 255, .55));
    }
    .ghost-body {
      position: absolute;
      inset: 0;
      border: 2px solid #1a2030;
      border-radius: 50% 50% 40% 40% / 55% 55% 40% 40%;
      background: linear-gradient(#f7fbff, #c8d8f0);
    }
    .ghost-body::after {
      position: absolute;
      right: 0;
      bottom: -2px;
      left: 0;
      height: 22%;
      content: "";
      background: radial-gradient(circle at 12% 0, transparent 10px, #c8d8f0 11px) 0 0 / 25% 100%, radial-gradient(circle at 37% 0, transparent 10px, #c8d8f0 11px) 25% 0 / 25% 100%, radial-gradient(circle at 62% 0, transparent 10px, #c8d8f0 11px) 50% 0 / 25% 100%, radial-gradient(circle at 87% 0, transparent 10px, #c8d8f0 11px) 75% 0 / 25% 100%;
    }
    .eye {
      position: absolute;
      top: 32%;
      width: 12px;
      height: 16px;
      border-radius: 50%;
      background: #121820;
    }
    .eye.left { left: 28%; }
    .eye.right { right: 28%; }
    .mouth {
      position: absolute;
      top: 55%;
      left: 50%;
      width: 18px;
      height: 14px;
      border-radius: 40% 40% 50% 50%;
      background: #121820;
      transform: translateX(-50%);
    }
    .ghost-one { width: 80px; height: 100px; animation: ghost-path-one 8s ease-in-out 3.1s forwards; }
    .ghost-two { width: 64px; height: 84px; animation: ghost-path-two 8s ease-in-out 3.4s forwards; }
    .ghost-three { width: 72px; height: 92px; animation: ghost-path-three 8s ease-in-out 3.6s forwards; }
    .ghost-four { width: 58px; height: 76px; animation: ghost-path-four 8s ease-in-out 3.9s forwards; }
    .ghost-five { z-index: 2; width: 90px; height: 110px; animation: ghost-path-five 8s ease-in-out 4.2s forwards; }
    .ghost-five .mouth { top: 52%; width: 28px; height: 26px; animation: mouth-boo 8s ease-in-out 3.1s forwards; }
    .ghost-five .eye { width: 16px; height: 22px; }

    .flash {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      background: #fff;
      opacity: 0;
      animation: scare-flash .35s ease-out 10.2s forwards;
    }

    .endcard {
      position: absolute;
      inset: 0;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .6em;
      padding: 8%;
      text-align: center;
      opacity: 0;
      animation: end-in .6s ease-out 11s forwards;
    }
    .presents { color: var(--cream); font-size: clamp(12px, 2.2vw, 22px); letter-spacing: .28em; text-transform: uppercase; }
    .time { color: var(--orange); font-size: clamp(36px, 8vw, 96px); font-weight: 800; letter-spacing: .06em; line-height: 1; text-shadow: 0 0 40px rgba(255, 122, 24, .45); }
    .handle { color: #e8f0ff; font-size: clamp(16px, 3vw, 32px); font-weight: 600; }
    .lamp-sil { position: relative; width: 48px; height: 64px; margin-bottom: .4em; opacity: .7; }
    .lamp-sil::before { position: absolute; top: 0; left: 50%; width: 36px; height: 18px; content: ""; background: var(--orange); clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%); transform: translateX(-50%); }
    .lamp-sil::after { position: absolute; top: 16px; left: 50%; width: 6px; height: 32px; content: ""; border-radius: 2px; background: var(--orange); transform: translateX(-50%) rotate(25deg); }

    @keyframes lamp-fall {
      0% { transform: translateX(-50%) rotate(0); }
      35% { transform: translateX(-50%) rotate(-4deg); }
      50% { transform: translateX(-50%) rotate(6deg); }
      65% { transform: translateX(-48%) rotate(-12deg); }
      80% { transform: translateX(-30%) rotate(28deg) translateY(8%); }
      92% { opacity: 1; transform: translateX(10%) rotate(78deg) translateY(55%); }
      100% { opacity: 0; transform: translateX(18%) rotate(95deg) translateY(72%); }
    }
    @keyframes glow-out { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes shard-fly { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx),var(--dy)) rotate(var(--rot)); } }
    @keyframes show-base { to { opacity: 1; } }
    @keyframes ghost-path-one { 0% { opacity: 0; transform: translate(-50%,20px) scale(.3); } 8% { opacity: 1; transform: translate(-50%,-40px) scale(.7); } 35% { opacity: 1; transform: translate(-120%,-120px) scale(1) rotate(-8deg); } 55% { opacity: 1; transform: translate(-80%,-80px) scale(1.1); } 75% { opacity: 1; transform: translate(-50%,-20px) scale(1.6); } 100% { opacity: 0; transform: translate(-50%,40px) scale(3.2); } }
    @keyframes ghost-path-two { 0% { opacity: 0; transform: translate(-50%,10px) scale(.2); } 10% { opacity: 1; transform: translate(20%,-60px) scale(.8); } 40% { opacity: 1; transform: translate(100%,-140px) scale(1) rotate(10deg); } 60% { opacity: 1; transform: translate(40%,-90px) scale(1.15); } 80% { opacity: 1; transform: translate(-20%,-30px) scale(1.8); } 100% { opacity: 0; transform: translate(-40%,60px) scale(3.5); } }
    @keyframes ghost-path-three { 0% { opacity: 0; transform: translate(-50%,0) scale(.25); } 10% { opacity: 1; transform: translate(-90%,-80px) scale(.75); } 40% { opacity: 1; transform: translate(-160%,-100px) scale(1) rotate(-12deg); } 65% { opacity: 1; transform: translate(-60%,-50px) scale(1.3); } 85% { opacity: 1; transform: translate(-50%,-10px) scale(2); } 100% { opacity: 0; transform: translate(-50%,80px) scale(4); } }
    @keyframes ghost-path-four { 0% { opacity: 0; transform: translate(-50%,15px) scale(.2); } 12% { opacity: 1; transform: translate(60%,-50px) scale(.7); } 45% { opacity: 1; transform: translate(140%,-160px) scale(.95) rotate(15deg); } 70% { opacity: 1; transform: translate(20%,-70px) scale(1.4); } 88% { opacity: 1; transform: translate(-30%,-20px) scale(2.2); } 100% { opacity: 0; transform: translate(-45%,70px) scale(3.8); } }
    @keyframes ghost-path-five { 0% { opacity: 0; transform: translate(-50%,10px) scale(.2); } 12% { opacity: 1; transform: translate(-50%,-70px) scale(.9); } 40% { opacity: 1; transform: translate(-50%,-110px) scale(1.15); } 58% { opacity: 1; transform: translate(-50%,-40px) scale(1.4); } 72% { opacity: 1; transform: translate(-50%,10%) scale(2.4); } 85% { opacity: 1; transform: translate(-50%,25%) scale(4.2); } 95% { opacity: 1; transform: translate(-50%,30%) scale(5.5); } 100% { opacity: 0; transform: translate(-50%,35%) scale(6); } }
    @keyframes mouth-boo { 0%,55% { transform: translateX(-50%) scale(1); } 75%,90% { transform: translateX(-50%) scale(1.6,1.8); } 100% { transform: translateX(-50%) scale(2); } }
    @keyframes scare-flash { 0% { opacity: 0; } 30% { opacity: .85; } 100% { opacity: 0; } }
    @keyframes end-in { to { opacity: 1; } }
    @keyframes scene-out { to { opacity: 0; visibility: hidden; } }
    @keyframes video-in { to { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; }
      .video-background { opacity: 1; }
      .stage { display: none; }
    }
  </style>
</head>
<body>
  <video class="video-background" autoplay muted loop playsinline aria-hidden="true">
    <source src="/hallowbg.mp4" type="video/mp4">
  </video>
  <main class="stage" aria-label="Halloween event animation">
    <div class="wall"></div>
    <div class="window"><div class="moon"></div></div>
    <div class="floor"></div>
    <div class="table"></div>
    <div class="lamp">
      <div class="lamp-glow"></div><div class="lamp-shade"></div><div class="lamp-stem"></div><div class="lamp-base"></div>
    </div>
    <div class="broken-base"></div>
    <div class="shards" aria-hidden="true"><i class="shard"></i><i class="shard"></i><i class="shard"></i><i class="shard"></i><i class="shard"></i><i class="shard"></i></div>
    <div class="ghosts" aria-hidden="true">
      <div class="ghost ghost-one"><div class="ghost-body"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div></div>
      <div class="ghost ghost-two"><div class="ghost-body"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div></div>
      <div class="ghost ghost-three"><div class="ghost-body"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div></div>
      <div class="ghost ghost-four"><div class="ghost-body"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div></div>
      <div class="ghost ghost-five"><div class="ghost-body"><i class="eye left"></i><i class="eye right"></i><i class="mouth"></i></div></div>
    </div>
    <div class="flash"></div>
    <section class="endcard">
      <div class="lamp-sil" aria-hidden="true"></div>
      <div class="presents">website redirecter presents</div>
      <div class="time">7 pm</div>
      <div class="handle">@MeTheCrazy</div>
    </section>
  </main>
</body>
</html>
