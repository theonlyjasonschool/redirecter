<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d0c">
  <link rel="icon" type="image/jpeg" href="/redirectlogo.jpg">
  <title>redirecter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      --ink: #f1f0e8;
      --muted: #8d9286;
      --acid: #d6f36a;
      --line: rgba(241, 240, 232, 0.14);
      --panel: rgba(20, 23, 19, 0.72);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background: #0c0d0c;
      font-family: 'Space Grotesk', sans-serif;
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -2;
      content: '';
      background:
        linear-gradient(115deg, transparent 0 44%, rgba(214, 243, 106, 0.06) 44.1% 44.3%, transparent 44.4%),
        linear-gradient(295deg, transparent 0 65%, rgba(241, 240, 232, 0.045) 65.1% 65.2%, transparent 65.3%),
        radial-gradient(circle at 75% 18%, rgba(214, 243, 106, 0.12), transparent 25rem),
        #0c0d0c;
    }

    body::after {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: '';
      opacity: 0.25;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }

    main {
      display: grid;
      min-height: 100vh;
      padding: clamp(1.25rem, 4vw, 3.5rem);
      grid-template-rows: auto 1fr auto;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--ink);
    }

    .mark::before {
      width: 0.55rem;
      height: 0.55rem;
      content: '';
      border-radius: 50%;
      background: var(--acid);
      box-shadow: 0 0 1rem var(--acid);
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4rem 0;
    }

    .content {
      width: min(100%, 66rem);
    }

    .eyebrow {
      margin: 0 0 1.5rem;
      color: var(--acid);
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 11ch;
      margin: 0;
      font-size: clamp(4.5rem, 16vw, 12.5rem);
      font-weight: 600;
      letter-spacing: -0.08em;
      line-height: 0.78;
    }

    .rule {
      width: min(100%, 45rem);
      height: 1px;
      margin: clamp(2.5rem, 7vw, 5.5rem) 0 1.5rem;
      background: var(--line);
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .action-copy {
      max-width: 14rem;
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .launch-button {
      display: inline-flex;
      align-items: center;
      gap: 1.2rem;
      min-height: 3.75rem;
      padding: 0.75rem 1rem 0.75rem 1.35rem;
      border: 1px solid var(--acid);
      border-radius: 0;
      color: var(--ink);
      background-image: linear-gradient(rgba(12, 13, 12, 0.42), rgba(12, 13, 12, 0.42)), url('/wallpaper1.jpg');
      background-position: center;
      background-size: cover;
      cursor: pointer;
      font: 600 0.9rem 'Space Grotesk', sans-serif;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .launch-button span {
      display: grid;
      width: 2.25rem;
      height: 2.25rem;
      place-items: center;
      color: var(--acid);
      background: #10120e;
      font-size: 1.25rem;
      line-height: 1;
    }

    .launch-button:hover {
      box-shadow: 0.7rem 0.7rem 0 rgba(214, 243, 106, 0.16);
      transform: translate(-0.2rem, -0.2rem);
    }

    .launch-button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 5px;
    }

    footer { align-items: end; }

    .status { color: var(--acid); }

    @media (max-width: 600px) {
      body { overflow: auto; }
      main { min-height: 100svh; }
      .hero { align-items: center; }
      .action-row { align-items: flex-start; flex-direction: column; gap: 1.25rem; }
      footer { align-items: flex-start; flex-direction: column; gap: 0.4rem; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="mark">redirecter</div>
      <div>signal / 001</div>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="content">
        <p class="eyebrow">destination found</p>
        <h1 id="page-title">redirecter</h1>
        <div class="rule"></div>
        <div class="action-row">
          <p class="action-copy">One door. One destination. Step through when you are ready.</p>
          <button class="launch-button" type="button" onclick="window.open('https://backrooms-game-oz0r.onrender.com/', '_blank', 'noopener,noreferrer')">
            backrooms game
            <span aria-hidden="true">↗</span>
          </button>
        </div>
      </div>
    </section>

    <footer>
      <div>access point online</div>
      <div class="status">● ready to redirect</div>
    </footer>
  </main>
</body>
</html>
